<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BusCity Admin - Quản lý Tin tức</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>BusCity Admin</h1>
        <div class="header-user">
          <span id="user-email"></span>
          <button id="signout-btn">Đăng xuất</button>
          <a href="index.html" class="header-link">← Quay lại</a>
        </div>
      </header>

      <main>
        <section id="news-section">
          <div id="editor">
            <h2>📰 Đăng / Sửa Tin tức</h2>
            <form id="news-form">
              <label for="news-title" class="sr-only">Tiêu đề</label>
              <input
                id="news-title"
                name="news-title"
                type="text"
                placeholder="Tiêu đề"
                title="Tiêu đề"
                required
              />

              <label for="news-content" class="sr-only">Nội dung</label>
              <textarea
                id="news-content"
                name="news-content"
                placeholder="Nội dung"
                rows="4"
                title="Nội dung"
              ></textarea>

              <label for="news-image-url" class="sr-only">URL hình ảnh</label>
              <input
                id="news-image-url"
                name="news-image-url"
                type="text"
                placeholder="URL hình (tùy chọn)"
                title="URL hình (tùy chọn)"
              />

              <label for="news-image-file" class="sr-only"
                >Tải lên hình ảnh</label
              >
              <input
                id="news-image-file"
                name="news-image-file"
                type="file"
                accept="image/*"
                title="Tải lên hình ảnh"
              />

              <div id="upload-progress" class="hidden">
                Uploading: <span id="upload-percent">0%</span>
              </div>

              <label for="news-date" class="sr-only">Ngày</label>
              <input
                id="news-date"
                name="news-date"
                type="date"
                title="Ngày đăng"
              />

              <div class="form-actions">
                <button id="save-news-btn" type="submit" class="primary-cta">
                  Lưu tin
                </button>
                <button
                  id="cancel-edit-btn"
                  type="button"
                  class="cancel-cta hidden"
                >
                  Hủy
                </button>
              </div>
            </form>
          </div>

          <div id="list">
            <h2>📋 Danh sách Tin tức</h2>
            <div id="news-list"></div>
          </div>
        </section>
      </main>

      <footer>
        <small
          >Ứng dụng quản trị đơn giản — sử dụng Firebase Realtime Database &
          Auth</small
        >
      </footer>
    </div>

    <script type="module" src="news.js"></script>
  </body>
</html>
