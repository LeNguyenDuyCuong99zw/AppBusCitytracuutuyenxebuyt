<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BusCity Admin - Quản lý Tin tức</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>BusCity Admin</h1>
        <div class="header-user">
          <span id="user-email"></span>
          <button id="signout-btn">Đăng xuất</button>
          <a href="index.html" class="header-link">← Quay lại</a>
        </div>
      </header>

      <main>
        <section id="news-section">
          <div id="editor">
            <h2>📰 Đăng / Sửa Tin tức</h2>
            <form id="news-form">
              <input
                id="news-title"
                type="text"
                placeholder="Tiêu đề"
                required
              />
              <textarea
                id="news-content"
                placeholder="Nội dung"
                rows="4"
              ></textarea>
              <input
                id="news-image-url"
                type="text"
                placeholder="URL hình (tùy chọn)"
              />
              <input id="news-image-file" type="file" accept="image/*" />
              <div id="upload-progress" class="hidden">
                Uploading: <span id="upload-percent">0%</span>
              </div>
              <input id="news-date" type="date" />
              <div class="form-actions">
                <button id="save-news-btn" type="submit" class="primary-cta">
                  Lưu tin
                </button>
                <button
                  id="cancel-edit-btn"
                  type="button"
                  class="cancel-cta hidden"
                >
                  Hủy
                </button>
              </div>
            </form>
          </div>

          <div id="list">
            <h2>📋 Danh sách Tin tức</h2>
            <div id="news-list"></div>
          </div>
        </section>
      </main>

      <footer>
        <small
          >Ứng dụng quản trị đơn giản — sử dụng Firebase Realtime Database &
          Auth</small
        >
      </footer>
    </div>

    <script type="module" src="news.js"></script>
  </body>
</html>
