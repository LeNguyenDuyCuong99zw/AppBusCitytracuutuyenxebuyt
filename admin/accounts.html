<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BusCity Admin - Quản lý Tài khoản</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>BusCity Admin</h1>
        <div class="header-user">
          <span id="user-email"></span>
          <button id="signout-btn">Đăng xuất</button>
          <a href="index.html" class="header-link">← Quay lại</a>
        </div>
      </header>

      <main>
        <section id="accounts-section">
          <!-- Tab navigation -->
          <div class="tab-navigation">
            <button class="tab-btn active" data-tab="admin-manage">
              👥 Admins
            </button>
            <button class="tab-btn" data-tab="user-manage">
              👤 Người dùng
            </button>
          </div>

          <!-- Admin Management Tab -->
          <div id="admin-manage" class="tab-content active">
            <h2>👥 Quản lý Admins</h2>
            <p class="muted-small mb-16">
              Thêm/xóa UID để cấp quyền quản trị cho người khác.
            </p>
            <form id="add-admin-form">
              <input
                id="admin-uid-input"
                type="text"
                placeholder="UID (dán vào)"
              />
              <div class="form-actions admin-form-actions">
                <button
                  id="fill-my-uid-btn"
                  type="button"
                  class="primary-cta btn-fill-uid"
                >
                  Dán UID
                </button>
                <button
                  id="add-admin-btn"
                  type="submit"
                  class="primary-cta btn-add-admin"
                >
                  ➕ Thêm Admin
                </button>
              </div>
            </form>
            <div id="auth-error" class="auth-error hidden"></div>

            <div id="list">
              <h2>👤 Danh sách Admins</h2>
              <div id="admin-list"></div>
            </div>
          </div>

          <!-- User Management Tab -->
          <div id="user-manage" class="tab-content">
            <h2>👤 Quản lý Người dùng</h2>
            <p class="muted-small mb-16">
              Xem thông tin và thống kê người dùng.
            </p>

            <!-- User Stats -->
            <div id="user-stats" class="user-stats-container"></div>

            <!-- User Search/Filter -->
            <div class="filter-group">
              <label for="search-user" class="sr-only">Tìm người dùng</label>
              <input
                type="text"
                id="search-user"
                placeholder="Tìm email, tên hoặc UID..."
                class="search-input"
              />
              <button id="search-user-btn" class="primary-cta">🔍 Tìm</button>
            </div>

            <!-- Users List -->
            <div id="users-list" class="users-list-container"></div>
          </div>
        </section>
      </main>

      <footer>
        <small
          >Ứng dụng quản trị đơn giản — sử dụng Firebase Realtime Database &
          Auth</small
        >
      </footer>
    </div>

    <script type="module" src="accounts.js"></script>
  </body>
</html>
