<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BusCity Admin - Quản lý Tài khoản</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>BusCity Admin</h1>
        <div class="header-user">
          <span id="user-email"></span>
          <button id="signout-btn">Đăng xuất</button>
          <a href="index.html" class="header-link">← Quay lại</a>
        </div>
      </header>

      <main>
        <section id="accounts-section">
          <div id="admin-manage">
            <h2>👥 Quản lý Admins</h2>
            <p style="font-size: 13px; color: #666; margin-bottom: 16px">
              Thêm/xóa UID để cấp quyền quản trị cho người khác.
            </p>
            <form id="add-admin-form">
              <input
                id="admin-uid-input"
                type="text"
                placeholder="UID (dán vào)"
              />
              <div class="form-actions" style="margin-top: 12px">
                <button
                  id="fill-my-uid-btn"
                  type="button"
                  class="primary-cta"
                  style="flex: 0.8"
                >
                  Dán UID
                </button>
                <button
                  id="add-admin-btn"
                  type="submit"
                  class="primary-cta"
                  style="flex: 1.2"
                >
                  ➕ Thêm Admin
                </button>
              </div>
            </form>
            <div id="auth-error" class="auth-error hidden"></div>
          </div>

          <div id="list">
            <h2>👤 Danh sách Admins</h2>
            <div id="admin-list"></div>
          </div>
        </section>
      </main>

      <footer>
        <small
          >Ứng dụng quản trị đơn giản — sử dụng Firebase Realtime Database &
          Auth</small
        >
      </footer>
    </div>

    <script type="module" src="accounts.js"></script>
  </body>
</html>
