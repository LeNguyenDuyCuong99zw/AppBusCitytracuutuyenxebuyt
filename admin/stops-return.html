<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BusCity Admin - Quản lý Trạm Lượt Về</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>BusCity Admin - Quản Lý Trạm Lượt Về</h1>
        <div id="user-area" class="hidden header-user">
          <span id="user-email"></span>
          <button id="signout-btn">Đăng xuất</button>
        </div>
      </header>

      <main>
        <!-- Trang Đăng nhập -->
        <section id="auth-hero" class="hero">
          <div class="hero-left">
            <div class="hero-illustration">
              <svg
                class="hero-mark"
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden
              >
                <path
                  d="M12 2L13.9 8.6L20.9 9.2L15.5 13.6L17.2 20.4L12 16.8L6.8 20.4L8.5 13.6L3.1 9.2L10.1 8.6L12 2Z"
                  fill="white"
                  opacity="0.95"
                />
              </svg>
              <div class="hero-content">
                <h3 class="hero-remark">Trang Quản Lý</h3>
                <h2 class="hero-title">Quản Lý Dữ Liệu Trạm</h2>
                <p class="hero-sub">Thêm, sửa, xóa thông tin trạm lượt về</p>
              </div>
            </div>
          </div>
          <div class="hero-right">
            <div class="auth-card">
              <div class="auth-header-flex">
                <div class="accent-dot" aria-hidden></div>
                <h3 class="no-margin">Đăng nhập Admin</h3>
              </div>
              <form id="login-form" class="auth-form auth-card-form">
                <input id="email" type="email" placeholder="Email" required />
                <input
                  id="password"
                  type="password"
                  placeholder="Mật khẩu"
                  required
                />
                <div class="auth-actions">
                  <button id="login-btn" type="submit" class="primary-cta">
                    Đăng nhập
                  </button>
                </div>
                <div id="auth-error" class="auth-error hidden"></div>
              </form>
            </div>
          </div>
        </section>

        <!-- Trang Quản Lý Trạm Lượt Về (sau đăng nhập) -->
        <section id="returns-section" class="hidden">
          <div id="editor">
            <h2>📍 Thêm/Chỉnh Sửa Trạm Lượt Về</h2>
            <form id="returns-form">
              <input id="return-id" type="hidden" />
              <input
                id="route-number"
                type="text"
                placeholder="Số Tuyến (vd: 01, 18, MRT1)"
                required
              />
              <input
                id="stop-name"
                type="text"
                placeholder="Tên Trạm (vd: Bến Thành)"
                required
              />
              <input
                id="stop-order"
                type="number"
                placeholder="Thứ Tự Trạm (vd: 1, 2, 3...)"
                required
              />
              <input
                id="latitude"
                type="number"
                step="0.0001"
                placeholder="Vĩ độ (vd: 10.7700)"
                required
              />
              <input
                id="longitude"
                type="number"
                step="0.0001"
                placeholder="Kinh độ (vd: 106.6900)"
                required
              />
              <div class="form-actions">
                <button type="submit" class="primary-cta">Lưu Trạm</button>
                <button type="button" id="cancel-btn" class="cancel-cta hidden">
                  Hủy
                </button>
              </div>
            </form>
          </div>

          <div id="list">
            <h2>📋 Danh Sách Trạm Lượt Về</h2>
            <div class="mb-16">
              <button id="import-btn" class="primary-cta import-btn--green">
                📥 Import Dữ Liệu Mẫu
              </button>
            </div>
            <div class="mb-16">
              <input
                id="search-stop"
                type="text"
                placeholder="🔍 Tìm kiếm trạm (số tuyến, tên trạm)..."
                class="search-inline"
              />
            </div>
            <div id="returns-list"></div>
          </div>
        </section>
      </main>

      <footer>
        <small
          >Ứng dụng quản trị đơn giản — sử dụng Firebase Realtime Database &
          Auth</small
        >
      </footer>
    </div>

    <!-- Firebase JS SDK (modular) via CDN -->
    <script type="module" src="stops-return.js"></script>
  </body>
</html>
